<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ topic }} — Quiz · EduAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/quiz.css') }}">
</head>
<body class="quiz-page">
  <div class="quiz-topbar">
    <div class="quiz-topic">{{ topic }}</div>
    <div class="quiz-progress" id="questionProgress">Question 1 of {{ questions|length }}</div>
    {% if timed %}
      <div class="quiz-timer" id="quizTimer">
        <svg class="icon icon-16" aria-hidden="true"><use href="{{ url_for('static', filename='icons/lucide.svg') }}#clock"></use></svg>
        <span id="timerText">--:--</span>
      </div>
    {% else %}
      <div></div>
    {% endif %}
  </div>

  <div class="quiz-body">
    <div class="quiz-question-area">
      <div class="quiz-question-inner">
        <div class="progress-track" style="margin-bottom: 24px;">
          <div class="progress-fill" id="answeredProgress" style="width:0%;"></div>
        </div>
        <div class="quiz-question-text" id="questionText"></div>
        <div id="optionsContainer"></div>
        <div class="quiz-nav-row">
          <button class="btn-secondary" id="prevBtn">
            <svg class="icon icon-16" aria-hidden="true" style="transform:rotate(180deg);"><use href="{{ url_for('static', filename='icons/lucide.svg') }}#chevron-right"></use></svg>
            Previous
          </button>
          <button class="btn-ghost" id="flagBtn">Flag this question</button>
          <button class="btn-secondary" id="nextBtn">
            Next
            <svg class="icon icon-16" aria-hidden="true"><use href="{{ url_for('static', filename='icons/lucide.svg') }}#chevron-right"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <aside class="quiz-palette">
      <div>
        <div class="text-2xs" style="color:var(--text-muted); text-transform:uppercase; margin-bottom:10px;">Questions</div>
        <div class="palette-grid" id="paletteGrid"></div>
      </div>
      <div class="palette-legend">
        <div class="item"><span class="dot" style="background:var(--success);"></span> Answered</div>
        <div class="item"><span class="dot" style="background:var(--bg-surface-3); border:1px solid var(--border-strong);"></span> Unanswered</div>
        <div class="item"><span class="dot" style="background:var(--warning);"></span> Flagged</div>
      </div>
      <button class="btn-primary btn-block" id="submitBtn">Submit Quiz</button>
    </aside>
  </div>

  <script id="questionsData" type="application/json">{{ questions | tojson }}</script>
  <script>
    window.QUIZ_ID = {{ quiz_id | tojson }};
    window.QUIZ_TIMED = {{ timed | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
</body>
</html>
