{% extends "base.html" %}
{% block title %}Create Test · EduAI{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="text-h1">Create Test</h1>
    <p class="text-sm" style="color:var(--text-muted);">Step 1 of 2 — basic details. You'll add questions next.</p>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('tests.create') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Test Title <span class="required">*</span></label>
        <input class="form-control" type="text" name="title" required>
      </div>
      <div class="form-group">
        <label class="form-label">Subject <span class="required">*</span></label>
        <input class="form-control" type="text" name="subject" required>
      </div>
      <div class="form-group">
        <label class="form-label">Instructions</label>
        <textarea class="form-control" name="instructions" rows="3" placeholder="e.g. Answer all questions. No negative marking."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Time Limit (minutes, leave blank for no limit)</label>
        <input class="form-control" type="number" name="time_limit_minutes" min="1">
      </div>
      <button type="submit" class="btn-primary btn-block btn-lg">Continue to Add Questions</button>
    </form>
  </div>
</div>
{% endblock %}
