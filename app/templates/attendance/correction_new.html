{% extends "base.html" %}
{% block title %}Request Attendance Correction · EduAI{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="text-h1">Request an Attendance Correction</h1>
    <p class="text-sm" style="color:var(--text-muted);">For dates within the last 30 days. Max 2 requests per week.</p>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('corrections.new') }}" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Date <span class="required">*</span></label>
        <input class="form-control" type="date" name="requested_date" required>
      </div>
      <div class="form-group">
        <label class="form-label">Reason</label>
        <select class="form-control" name="reason_category">
          {% for r in reasons %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Explanation <span class="required">*</span></label>
        <textarea class="form-control" name="explanation" rows="4" minlength="20" maxlength="500" required placeholder="20-500 characters..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Proof (optional — photo or PDF)</label>
        <input class="form-control" type="file" name="proof" accept=".jpg,.jpeg,.png,.pdf">
      </div>
      <button type="submit" class="btn-primary btn-block btn-lg">Submit Request</button>
    </form>
  </div>
</div>
{% endblock %}
