{% extends "base.html" %}
{% block title %}{{ page_title }} · EduAI{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="text-h1">{{ page_title }}</h1>
    <p class="text-sm" style="color:var(--text-muted);">{{ page_description }}</p>
  </div>
</div>

<div class="card">
  <div class="card-body" style="text-align:center; padding:64px 20px;">
    <svg class="icon icon-24" style="width:40px;height:40px;color:var(--text-disabled);margin-bottom:16px;" aria-hidden="true">
      <use href="{{ url_for('static', filename='icons/lucide.svg') }}#{{ icon | default('clock') }}"></use>
    </svg>
    <h3 class="text-h3" style="margin-bottom:6px;">This module is being built</h3>
    <p class="text-sm" style="color:var(--text-muted); max-width:420px; margin:0 auto;">
      {{ page_title }} is on the EduAI build roadmap and isn't wired up yet in this environment.
    </p>
  </div>
</div>
{% endblock %}
