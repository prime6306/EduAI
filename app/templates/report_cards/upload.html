{% extends "base.html" %}
{% block title %}New Report Card Batch · EduAI{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/report-cards.css') }}">{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="text-h1">New Report Card Batch</h1>
    <p class="text-sm" style="color:var(--text-muted);">Step 1 — define the assessment components you'll enter marks for.</p>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('report_cards.upload') }}" id="batchForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="grid-1-1">
        <div class="form-group"><label class="form-label">Title <span class="required">*</span></label><input class="form-control" name="title" required placeholder="e.g. Mid-Semester Report"></div>
        <div class="form-group"><label class="form-label">Subject <span class="required">*</span></label><input class="form-control" name="subject" required></div>
      </div>
      <div class="grid-1-1">
        <div class="form-group"><label class="form-label">Semester</label><input class="form-control" name="semester" placeholder="e.g. 5"></div>
        <div class="form-group"><label class="form-label">Academic Year</label><input class="form-control" name="academic_year" placeholder="e.g. 2026-27"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Assessment Components</label>
        <div id="componentsContainer"></div>
        <button type="button" class="btn-secondary btn-sm" id="addComponentBtn">+ Add Component</button>
      </div>

      <button type="submit" class="btn-primary btn-block btn-lg" style="margin-top:20px;">Continue to Marks Entry</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const container = document.getElementById('componentsContainer');
  function addComponent(name, max) {
    const row = document.createElement('div');
    row.className = 'component-row';
    row.innerHTML = `
      <input class="form-control" name="component_name[]" placeholder="e.g. IA1" value="${name || ''}">
      <input class="form-control" name="component_max[]" type="number" placeholder="Max marks" value="${max || 20}">
      <button type="button" class="btn-icon" onclick="this.closest('.component-row').remove()">
        <svg class="icon icon-14" aria-hidden="true"><use href="/static/icons/lucide.svg#trash-2"></use></svg>
      </button>
    `;
    container.appendChild(row);
  }
  document.getElementById('addComponentBtn').addEventListener('click', () => addComponent());
  addComponent('IA1', 20);
  addComponent('IA2', 20);
  addComponent('Assignment', 10);
</script>
{% endblock %}
