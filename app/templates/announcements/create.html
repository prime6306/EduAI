{% extends "base.html" %}
{% block title %}Create Announcement · EduAI{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/announcements.css') }}">{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="text-h1">Create Announcement</h1>
    <p class="text-sm" style="color:var(--text-muted);">Visible to students immediately, or schedule for later.</p>
  </div>
  <a class="btn-secondary" href="{{ url_for('announcements.manage') }}">Manage Announcements</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('announcements.create') }}" enctype="multipart/form-data" id="annForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="body_html" id="bodyHtmlField">

      <div class="form-group">
        <label class="form-label">Title <span class="required">*</span></label>
        <input class="form-control" type="text" name="title" maxlength="100" required>
      </div>

      <div class="form-group">
        <label class="form-label">Body <span class="required">*</span></label>
        <div class="rich-toolbar">
          <button type="button" data-cmd="bold"><b>B</b></button>
          <button type="button" data-cmd="italic"><i>I</i></button>
          <button type="button" data-cmd="insertUnorderedList">-</button>
          <button type="button" data-cmd="createLink">Link</button>
        </div>
        <div class="rich-editor" id="richEditor" contenteditable="true"></div>
      </div>

      <div class="grid-1-1">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-control" name="category">
            {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Visibility</label>
          <select class="form-control" id="visibilitySelect" name="visibility_type">
            <option value="all">Entire Class</option>
            <option value="specific">Specific Students</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="specificStudentsGroup" style="display:none;">
        <label class="form-label">Select Students</label>
        <select class="form-control" name="visible_to_students[]" multiple size="6">
          {% for s in students %}<option value="{{ s.student_id }}">{{ s.name }} ({{ s.student_id }})</option>{% endfor %}
        </select>
      </div>

      <div class="grid-1-1">
        <div class="form-group">
          <label class="form-label">Schedule For (optional)</label>
          <input class="form-control" type="datetime-local" name="scheduled_for">
        </div>
        <div class="form-group">
          <label class="form-label">Expires At (optional)</label>
          <input class="form-control" type="datetime-local" name="expires_at">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Attachment (optional, max 20MB)</label>
        <input class="form-control" type="file" name="attachment" accept=".pdf,.docx,.xlsx,.jpg,.jpeg,.png">
      </div>

      <button type="submit" class="btn-primary btn-block btn-lg">Publish Announcement</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const editor = document.getElementById('richEditor');
  document.querySelectorAll('.rich-toolbar button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const cmd = btn.getAttribute('data-cmd');
      if (cmd === 'createLink') {
        const url = prompt('Link URL:');
        if (url) document.execCommand(cmd, false, url);
      } else {
        document.execCommand(cmd, false, null);
      }
      editor.focus();
    });
  });

  document.getElementById('visibilitySelect').addEventListener('change', function () {
    document.getElementById('specificStudentsGroup').style.display = this.value === 'specific' ? 'block' : 'none';
  });

  document.getElementById('annForm').addEventListener('submit', function () {
    document.getElementById('bodyHtmlField').value = editor.innerHTML;
  });

  const DRAFT_KEY = 'eduai_announcement_draft';
  const titleInput = document.querySelector('input[name="title"]');
  const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
  if (saved) {
    titleInput.value = saved.title || '';
    editor.innerHTML = saved.body || '';
  }
  setInterval(function () {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ title: titleInput.value, body: editor.innerHTML }));
  }, 5000);
  document.getElementById('annForm').addEventListener('submit', function () {
    localStorage.removeItem(DRAFT_KEY);
  });
</script>
{% endblock %}
